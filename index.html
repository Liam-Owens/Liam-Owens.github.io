<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lobotany Plant Shop</title>
  <link rel="icon" href="https://img.icons8.com/ios-filled/50/26e07f/plant-under-sun.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #111;
      color: #ff69b4;
      font-family: Arial, sans-serif;
    }
    .btn-custom {
      background-color: #ff69b4;
      color: #000;
      border: none;
    }
    .btn-custom:hover {
      background-color: #ff85c1;
    }
    .carousel-item img {
      object-fit: cover;
      height: 70vh;
      width: 100%;
    }
    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      filter: invert(91%) sepia(6%) saturate(7067%) hue-rotate(292deg) brightness(106%) contrast(103%);
      width: 3rem;
      height: 3rem;
    }
  </style>
</head>
<body>
  <div class="container-fluid px-3 px-md-5">
    <main class="text-center py-5">
      <h1>Welcome to The Lobotany Plant Shop</h1>
      <p>Plant joy, craft beauty. Your local green-thumb artist.</p>
      <div class="d-flex justify-content-center gap-3 my-4">
        <a href="https://palmstreet.app/u/JackieO?pr=gsVtL7zI" class="btn btn-custom">Palm Street</a>
        <a href="https://offerup.co/O6EnVlNriTb" class="btn btn-custom">OfferUp</a>
      </div>
    </main>

    <div id="flowerCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="1500">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://raw.githubusercontent.com/Liam-Owens/Assets/refs/heads/main/Images/plant.png" alt="Plant 0">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Liam-Owens/Assets/refs/heads/main/Images/plant1.png" alt="Plant 1">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Liam-Owens/Assets/refs/heads/main/Images/plant2.png" alt="Plant 2">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Liam-Owens/Assets/refs/heads/main/Images/plant4.png" alt="Plant 4">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Liam-Owens/Assets/refs/heads/main/Images/plant5.png" alt="Plant 5">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Liam-Owens/Assets/refs/heads/main/Images/plant6.png" alt="Plant 6">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#flowerCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#flowerCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>

<footer class="text-center mt-5 py-4">
  <hr style="border-top: 2px dashed #ff69b4; width: 60%; margin: auto;">
  <p class="mt-3" style="color: #ff85c1;">&copy; 2025 The Lobotany Plant Shop 🌿 Handmade with heart in every pot.</p>
</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
